name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The conformance suite's own verdict (exit code): shape + hermetic mech
      # probes — no network, no tokens.
      - run: ledvouch doctor
        env:
          LEDVOUCH_FAIL_POSTURE: closed
